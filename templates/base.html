<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Application Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            if (stored === 'dark' || stored === 'light') {
                document.documentElement.setAttribute('data-theme', stored);
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                        <rect x="9" y="2" width="6" height="3" rx="1"></rect>
                        <path d="M8.5 12.5l2.5 2.5 5-5"></path>
                    </svg>
                </span>
                <h1>Job Application Tracker</h1>
            </a>
            <button type="button" id="theme-toggle" class="btn btn-small theme-toggle" aria-label="Toggle dark mode">
                <span class="theme-toggle-icon" aria-hidden="true">◐</span>
            </button>
        </header>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-stack">
                {% for category, message in messages %}
                <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
